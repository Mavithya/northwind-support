# SQL Server for local development only. The password below is a throwaway local
# placeholder - never commit a real credential.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: supportdesk-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Local_Dev_Password1}"
      MSSQL_PID: Developer
    ports:
      - "14330:1433"
    volumes:
      - supportdesk-sql:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  supportdesk-sql:
